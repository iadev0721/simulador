{t:'SD',s:'neg',q:'¿Cuál NO es una de las suposiciones falsas de Deutsch?',
 o:['La latencia es cero','El ancho de banda es infinito','Los nodos no comparten un reloj global','La topología no cambia'],a:2,
 w:'Que no exista un reloj global es un HECHO real de los SD (cada nodo tiene su propia noción del tiempo), no una suposición falsa.',
 n:['Sí es falacia de Deutsch.','Sí es falacia de Deutsch.',null,'Sí es falacia de Deutsch.'],src:'CEN-02 · Consideraciones'},
{t:'SD',s:'neg',q:'¿Cuál NO es uno de los cuatro objetivos de diseño de un sistema distribuido?',
 o:['Hacer los recursos fácilmente accesibles','Ocultar que los recursos están distribuidos','Ser homogéneo','Ser escalable'],a:2,
 w:'Los cuatro objetivos: recursos accesibles, ocultar la distribución, ser abierto y ser escalable. La heterogeneidad es un DESAFÍO a soportar, no se busca homogeneidad.',
 n:['Objetivo: compartir recursos.','Objetivo: transparencia de distribución.',null,'Objetivo: escalabilidad.'],src:'CEN-02 · Objetivos del diseño'},
{t:'SD',s:'def',q:'Grado en que dos sistemas o componentes diferentes pueden coexistir y trabajar juntos, confiando en los servicios del otro según lo especificado por un estándar común.',
 o:['Portabilidad','Extensibilidad','Interoperabilidad','Transparencia de acceso'],a:2,
 w:'Interoperabilidad = trabajar JUNTOS. La palabra clave es "coexistir y trabajar juntos".',
 n:['Portabilidad = llevar UNA aplicación a OTRO sistema sin modificarla.','Extensibilidad = agregar o reemplazar componentes sin afectar al resto.',null,'Transparencia de acceso = ocultar diferencias de representación y forma de acceso.'],src:'CEN-02 · Sistema distribuido abierto',g:'abierto'},
{t:'SD',s:'casi',q:'Hasta qué punto una aplicación desarrollada para un sistema puede ejecutarse, sin modificaciones, en un sistema diferente que implementa las mismas interfaces.',
 o:['Interoperabilidad','Portabilidad','Escalabilidad administrativa','Extensibilidad'],a:1,
 w:'Portabilidad = mover la aplicación a otro sistema con las mismas interfaces y que corra sin cambios.',
 n:['Interoperabilidad = dos sistemas distintos trabajando juntos, no mover una aplicación.',null,'Escalabilidad administrativa es sobre muchas organizaciones administrativas.','Extensibilidad = agregar o reemplazar componentes.'],src:'CEN-02 · Sistema distribuido abierto',g:'abierto'},
{t:'SD',s:'casi',q:'En un sistema distribuido abierto, la facilidad de agregar nuevos componentes o reemplazar los existentes sin afectar a los que permanecen en su lugar se denomina:',
 o:['Extensibilidad','Portabilidad','Interoperabilidad','Escalabilidad de tamaño'],a:0,
 w:'Extensible: agregar o reemplazar componentes sin afectar a los demás. Por eso conviene organizar el sistema en componentes pequeños y reemplazables.',
 n:[null,'Portabilidad es mover una aplicación a otro sistema.','Interoperabilidad es trabajar juntos con base en un estándar.','Escalabilidad de tamaño es agregar usuarios y recursos sin perder rendimiento: no habla de reemplazar componentes.'],src:'CEN-02 · Sistema distribuido abierto (Adicionalmente...)',g:'abierto'},
{t:'SD',s:'casi',q:'Las especificaciones adecuadas de un sistema abierto son completas y neutrales. ¿Qué significa que sean NEUTRALES?',
 o:['Que todo lo necesario para hacer una implementación ha sido especificado','Que no prescriben cómo debe ser la implementación','Que capturan tanto la sintaxis como la semántica','Que se escriben en lenguaje natural'],a:1,
 w:'Neutral es "el hecho que no prescriben", es decir, no dicen CÓMO implementar.',
 n:['Esa es la definición de COMPLETA. Par confundible.',null,'Un IDL casi siempre captura solo la sintaxis; no es la definición de neutral.','El lenguaje natural es como se suele dar la semántica en la práctica, no qué es neutral.'],src:'CEN-02 · Sistema distribuido abierto',g:'abierto'},
{t:'SD',s:'casi',q:'Las definiciones de interfaz escritas en un IDL casi siempre capturan solo:',
 o:['La semántica de los servicios','La sintaxis de los servicios','La implementación de los servicios','La sintaxis y la semántica'],a:1,
 w:'El IDL captura la sintaxis. Lo difícil es especificar qué hacen (semántica), y eso se da de manera informal en lenguaje natural.',
 n:['La semántica es justamente lo que el IDL NO suele capturar.',null,'El IDL define interfaces, nunca la implementación.','Solo la sintaxis.'],src:'CEN-02 · Sistema distribuido abierto'},
{t:'SD',s:'def',q:'Enfoque en el que los componentes solo se separan lógicamente pero se implementan como un gran programa, lo que hace difícil reemplazar o adaptar un componente.',
 o:['Microservicios','Arquitectura en capas pura','Monolítico','Arquitectura orientada a servicios'],a:2,
 w:'La clase lo contrasta con la flexibilidad de los sistemas abiertos: el monolito dificulta reemplazar piezas.',
 n:['Microservicios es lo opuesto: servicios pequeños e independientes.','Las capas son un estilo arquitectónico; no implican un solo programa.',null,'SOA descompone la aplicación en servicios comunicados por un bus.'],src:'CEN-02 · Sistema distribuido abierto'},
{t:'SD',s:'def',q:'Dimensión de escalabilidad: se pueden agregar fácilmente más usuarios y recursos sin una pérdida notable de rendimiento.',
 o:['Escalabilidad geográfica','Escalabilidad vertical','Escalabilidad de tamaño','Escalabilidad administrativa'],a:2,
 w:'Neuman (1994): tamaño = más usuarios y recursos sin perder rendimiento.',
 n:['Geográfica = usuarios y recursos muy separados sin que se noten los retrasos.','Vertical es una forma de escalar (más recursos a una máquina), no una de las tres dimensiones de Neuman.',null,'Administrativa = muchas organizaciones administrativas independientes.'],src:'CEN-02 · Escalabilidad',g:'escal'},
{t:'SD',s:'def',q:'Sistema en el que los usuarios y los recursos pueden estar muy separados, pero apenas se nota que los retrasos en la comunicación pueden ser significativos.',
 o:['Escalable geográficamente','Escalable en tamaño','Escalable horizontalmente','Escalable administrativamente'],a:0,
 w:'La palabra clave es distancia y retraso: escalabilidad geográfica.',
 n:[null,'Tamaño = cantidad de usuarios y recursos.','Horizontal = agregar más máquinas; no habla de distancia.','Administrativa = muchas organizaciones.'],src:'CEN-02 · Escalabilidad',g:'escal'},
{t:'SD',s:'def',q:'Sistema que aún se puede administrar fácilmente incluso si abarca muchas organizaciones administrativas independientes.',
 o:['Escalable en tamaño','Escalable administrativamente','Sistema abierto','Escalable geográficamente'],a:1,
 w:'Tercera dimensión de Neuman: administrativa.',
 n:['Tamaño = usuarios y recursos.',null,'Abierto = componentes con interfaces estándar; no es una dimensión de escalabilidad.','Geográfica = distancia.'],src:'CEN-02 · Escalabilidad',g:'escal'},
{t:'SD',s:'def',q:'Según Neuman (1994), al escalar un sistema distribuido básicamente solo podemos aplicar tres técnicas:',
 o:['Virtualización, balanceo de carga y caché','Ocultar las latencias de comunicación, distribución del trabajo y replicación','Escalado vertical, horizontal y diagonal','Particionamiento, sincronización y replicación'],a:1,
 w:'Las tres técnicas: ocultar latencias, distribuir el trabajo y replicar.',
 n:['Suena moderno pero no es la lista de Neuman.',null,'Vertical y horizontal son formas de escalar vistas en clase; "diagonal" y la terna no son de Neuman.','Mezcla términos reales con uno ajeno (sincronización). Distractor inventado.'],src:'CEN-02 · Escalabilidad'},
{t:'SD',s:'casi',q:'Escalar agregando más máquinas o nodos al sistema (scale out) se conoce como:',
 o:['Escalabilidad vertical','Escalabilidad horizontal','Escalabilidad de tamaño','Escalabilidad geográfica'],a:1,
 w:'Horizontal = más nodos. Vertical = más capacidad (CPU, RAM) a la MISMA máquina.',
 n:['Vertical (scale up) es potenciar una máquina, no agregar máquinas.',null,'Tamaño es la dimensión que se mide, no la técnica de agregar nodos.','Geográfica es sobre distancia.'],src:'Anotaciones · Escalabilidad vertical y horizontal',g:'escal'},
{t:'SD',s:'casi',q:'Agregar más CPU y memoria a un mismo servidor para que soporte más carga (scale up) es escalabilidad:',
 o:['Horizontal','Administrativa','Vertical','De tamaño'],a:2,
 w:'Vertical = crecer "hacia arriba" la misma máquina.',
 n:['Horizontal = más máquinas.','Administrativa = muchas organizaciones.',null,'Tamaño es la dimensión (usuarios y recursos), no la técnica.'],src:'Anotaciones · Escalabilidad vertical y horizontal',g:'escal'},
{t:'SD',s:'app',q:'La distinción entre grupos abiertos y cerrados aparece en la clase al hablar de:',
 o:['La transparencia de ubicación','Administrar la membresía de la colección de nodos','La escalabilidad geográfica','El modelo ISO-OSI'],a:1,
 w:'Tratar con una colección de nodos implica administrar la membresía y su organización, por ejemplo por control de admisión (grupos abiertos vs cerrados).',
 n:['No tiene relación con grupos.',null,'No tiene relación con grupos.','No tiene relación con grupos.'],src:'CEN-02 · Características (Al tratar con...)'},
{t:'SD',s:'def',q:'En la práctica, un sistema distribuido a menudo se organiza como una red ________, ya sea estructurada o no.',
 o:['en estrella','superpuesta (overlay)','de área local','token ring'],a:1,
 w:'La clase: "un sistema distribuido a menudo se organiza como una red superpuesta, ya sea estructurada o no".',
 n:['Topología física, no la organización lógica de la colección.',null,'Tipo de red por alcance, no por organización.','Tecnología de red, no la organización de un SD.'],src:'CEN-02 · Características'},
{t:'SD',s:'app',q:'Como cada nodo autónomo tiene su propia noción del tiempo y no existe un reloj global, hay que considerar aspectos como:',
 o:['Marshalling y unmarshalling','Sincronización y coordinación','Encapsulamiento y segmentación','Portabilidad e interoperabilidad'],a:1,
 w:'Sin referencia común de tiempo aparecen los problemas de sincronización y coordinación (que se desarrollan en CEN-05).',
 n:['Es sobre representación de datos.',null,'Son mecanismos de comunicación en capas.','Son propiedades de los sistemas abiertos.'],src:'CEN-02 · Características'},

// ───────────────────────── Transparencia y desafíos ─────────────────────────
{t:'TR',s:'def',q:'Tipo de transparencia que oculta las diferencias en la representación de los datos y la forma en que se accede a un objeto.',
 o:['De ubicación','De acceso','De migración','De concurrencia'],a:1,
 w:'Access: "Hide differences in data representation and how an object is accessed".',
 n:['Ubicación oculta DÓNDE está el objeto.',null,'Migración oculta que el objeto puede moverse.','Concurrencia oculta que el objeto es compartido.'],src:'CEN-02 · Tipos de transparencia',g:'transp'},
{t:'TR',s:'def',q:'Tipo de transparencia que oculta dónde se localiza un objeto.',
 o:['De reubicación','De acceso','De ubicación','De replicación'],a:2,
 w:'Location: "Hide where an object is located".',
 n:['Reubicación oculta que se MUEVE mientras está en uso.','Acceso oculta la representación y forma de acceso.',null,'Replicación oculta que hay copias.'],src:'CEN-02 · Tipos de transparencia',g:'transp'},
{t:'TR',s:'casi',q:'Tipo de transparencia que oculta que un objeto puede ser movido a otra ubicación MIENTRAS está en uso.',
 o:['De migración','De reubicación','De ubicación','De movilidad'],a:1,
 w:'Relocation = movido mientras está en uso. La clave es "mientras está en uso".',
 n:['Migración oculta que el objeto PUEDE moverse, sin la condición de estar en uso. Es el par confundible.',null,'Ubicación oculta dónde está, no que se mueve.','Movilidad es el nombre de la lista de Coulouris (CEN-03): reubicar recursos sin afectar la operación. No es el término de la tabla de Tanenbaum.'],src:'CEN-02 · Tipos de transparencia',g:'transp'},
{t:'TR',s:'casi',q:'Tipo de transparencia que oculta que un objeto puede moverse a otra ubicación (tabla de Tanenbaum).',
 o:['De migración','De reubicación','De replicación','De acceso'],a:0,
 w:'Migration: "Hide that an object may move to another location".',
 n:[null,'Reubicación agrega "mientras está en uso".','Replicación oculta que hay copias.','Acceso oculta representación y forma de acceso.'],src:'CEN-02 · Tipos de transparencia',g:'transp'},
{t:'TR',s:'def',q:'Tipo de transparencia que oculta que un objeto puede ser compartido por varios usuarios independientes.',
 o:['De replicación','De concurrencia','De fallos','De acceso'],a:1,
 w:'Concurrency: "Hide that an object may be shared by several independent users".',
 n:['Replicación oculta que hay varias copias, no varios usuarios.',null,'Fallos oculta la falla y recuperación.','Acceso oculta la forma de acceso.'],src:'CEN-02 · Tipos de transparencia',g:'transp'},
{t:'TR',s:'def',q:'Tipo de transparencia que oculta la falla y la recuperación de un objeto.',

 w:'Failure: "Hide the failure and recovery of an object".',
 n:[null,'La replicación ayuda a tolerar fallos, pero la transparencia que oculta la falla es la de fallos.','Prestaciones permite reconfigurar el sistema según la carga.','Migración oculta que el objeto se mueve.'],src:'CEN-02 · Tipos de transparencia',g:'transp'},
{t:'TR',s:'def',q:'Tipo de transparencia que oculta que un objeto está replicado.',
 o:['De concurrencia','De replicación','De ubicación','De escalado'],a:1,
 w:'Replication: "Hide that an object is replicated".',
 n:['Concurrencia: compartido por varios usuarios.',null,'Ubicación: dónde está.','Escalado: crecer sin cambiar estructura.'],src:'CEN-02 · Tipos de transparencia',g:'transp'},
{t:'TR',s:'def',q:'Forma de transparencia que permite reconfigurar el sistema para mejorar el desempeño según varía la carga.',
 o:['De escalado','De prestaciones','De movilidad','De concurrencia'],a:1,
 w:'CEN-03 (lista de Coulouris): "De prestaciones, permite reconfigurar el sistema según la carga".',
 n:['Escalado: expandirse en tamaño sin cambiar estructura ni algoritmos.',null,'Movilidad: reubicar recursos sin afectar la operación.','Concurrencia: procesos operan concurrentemente.'],src:'CEN-03 · Desafíos: Transparencia',g:'transp'},
{t:'TR',s:'casi',q:'Forma de transparencia que permite al sistema expandirse en tamaño sin cambios en la estructura del sistema ni en los algoritmos de aplicación.',
 o:['Escalabilidad de tamaño','De prestaciones','De escalado','De movilidad'],a:2,
 w:'Transparencia de escalado (CEN-03). Ojo: es una TRANSPARENCIA, no una dimensión de escalabilidad.',
 n:['Trampa: escalabilidad de tamaño es una dimensión de Neuman (agregar usuarios y recursos), no una forma de transparencia.','Prestaciones: reconfigurar según la carga.',null,'Movilidad: reubicar recursos.'],src:'CEN-03 · Desafíos: Transparencia',g:'transp'},
{t:'TR',s:'def',q:'Forma de transparencia que permite reubicar recursos sin afectar la operación de usuarios o programas.',
 o:['De movilidad','De prestaciones','De acceso','De escalado'],a:0,
 w:'CEN-03: "De movilidad, permite reubicar recursos sin afectar la operación".',
 n:[null,'Prestaciones: reconfigurar según la carga.','Acceso: operaciones idénticas para recursos locales y remotos.','Escalado: crecer sin cambiar estructura.'],src:'CEN-03 · Desafíos: Transparencia',g:'transp'},
{t:'TR',s:'def',q:'Capacidad de ocultar al usuario y al programador de aplicaciones la separación de los componentes de un sistema distribuido.',
 o:['Coherencia','Transparencia','Apertura','Heterogeneidad'],a:1,
 w:'Definición de transparencia en CEN-03.',
 n:['Coherencia es comportarse según las expectativas del usuario; la transparencia es el mecanismo de ocultar.',null,'Apertura (sistema abierto) es sobre interfaces estándar y extensibilidad.','Heterogeneidad es la variedad de redes, hardware, SO y lenguajes.'],src:'CEN-03 · Desafíos: Transparencia'},
{t:'TR',s:'def',q:'Desafío de construcción: permitir a los usuarios acceder a servicios y ejecutar aplicaciones sobre una variedad de redes, hardware, sistemas operativos y lenguajes de programación.',
 o:['Extensibilidad','Heterogeneidad','Concurrencia','Transparencia de acceso'],a:1,
 w:'Heterogeneidad de los componentes (CEN-03).',
 n:['Extensibilidad es poder añadir nuevos servicios.',null,'Concurrencia es acceso simultáneo a recursos compartidos.','La transparencia de acceso ayuda a ocultar diferencias, pero el desafío que se describe es la heterogeneidad.'],src:'CEN-03 · Desafíos en su construcción'},
{t:'TR',s:'def',q:'Desafío que determina el grado en que se pueden añadir nuevos servicios de compartición de recursos, y que exige publicar las interfaces. A estos sistemas se les etiqueta como abiertos.',
 o:['Escalabilidad','Extensibilidad','Interoperabilidad','Portabilidad'],a:1,
 w:'Extensibilidad: sistemas distribuidos ABIERTOS, para remarcar que son extensibles.',
 n:['Escalabilidad es conservar efectividad al crecer.',null,'Interoperabilidad es trabajar juntos según un estándar.','Portabilidad es mover una aplicación sin modificarla.'],src:'CEN-03 · Desafíos en su construcción',g:'abierto'},
{t:'TR',s:'def',q:'Los tres componentes de la seguridad de los recursos de información son:',
 o:['Autenticación, autorización y auditoría','Confidencialidad, integridad y disponibilidad','Confidencialidad, integridad y autenticidad','Cifrado, firma y certificados'],a:1,
 w:'La tríada CID: confidencialidad, integridad, disponibilidad.',
 n:['Eso es AAA, otro modelo de seguridad; no es la lista de la clase.',null,'Cambia disponibilidad por autenticidad: casi igual, pero no es lo de la clase.','Son mecanismos, no componentes de la seguridad.'],src:'CEN-03 · Desafíos: Seguridad'},
{t:'TR',s:'neg',q:'¿Cuál NO es un reto de los sistemas escalables según la clase?',
 o:['Control del coste de los recursos físicos','Evitar los cuellos de botella de prestaciones','Garantizar un reloj global','Prevención de desbordamiento de recursos de software'],a:2,
 w:'Los retos: coste de recursos físicos, pérdida de prestaciones, desbordamiento de recursos de software y cuellos de botella. Un reloj global no existe en SD.',
 n:['Sí es reto.','Sí es reto.',null,'Sí es reto.'],src:'CEN-03 · Desafíos: Escalabilidad'},
{t:'TR',s:'neg',q:'¿Cuál NO es una técnica de tratamiento de fallos mencionada en clase?',
 o:['Enmascaramiento de fallos','Redundancia','Marshalling','Recuperación frente a fallos'],a:2,
 w:'Técnicas: detección, enmascaramiento, tolerancia, recuperación y redundancia. Marshalling es de representación de datos.',
 n:['Sí es técnica.','Sí es técnica.',null,'Sí es técnica.'],src:'CEN-03 · Desafíos: Tratamiento de fallos'},
{t:'TR',s:'app',q:'Si un servicio atiende a los clientes uno por uno para evitar conflictos sobre un recurso compartido, ¿qué limita?',
 o:['La transparencia','El ritmo del sistema (throughput)','La portabilidad','La heterogeneidad'],a:1,
 w:'La clase: atender una por una "limita el ritmo del sistema (throughput)". Por eso se procesa concurrentemente y se sincroniza.',
 n:['No tiene relación directa.',null,'No tiene relación directa.','No tiene relación directa.'],src:'CEN-03 · Desafíos: Concurrencia'},
{t:'TR',s:'app',q:'En un sistema distribuido, los fallos se caracterizan por ser:',
 o:['Totales: si falla un nodo cae todo el sistema','Parciales: algunos componentes fallan y otros siguen funcionando','Imposibles de detectar','Siempre bizantinos'],a:1,
 w:'Los fallos son PARCIALES; eso hace difícil su tratamiento.',
 n:['Esa es la situación de un sistema centralizado.',null,'Existe la detección de fallos como técnica.','Bizantino es un tipo específico de fallo, no la regla.'],src:'CEN-03 · Tratamiento de fallos'},

// ───────────────────────── CEN-03 · Arquitecturas ─────────────────────────
{t:'AR',s:'def',q:'Organización lógica de un sistema distribuido en componentes de software; define la estructura, funcionamiento e interacción entre las partes del software.',

{t:'AR',s:'casi',q:'Define una familia de sistemas en términos de patrones estructurales, de control y de comunicación; se formula en términos de componentes, conexiones, datos intercambiados y configuración.',

{t:'AR',s:'def',q:'Unidad modular con interfaces requeridas y proporcionadas bien definidas que es reemplazable dentro de su entorno.',

{t:'AR',s:'def',q:'Mecanismo que media la comunicación, la coordinación o la cooperación entre los componentes; por ejemplo RPC, paso de mensajes o transmisión de datos.',

{t:'AR',s:'neg',q:'¿Cuál NO es uno de los estilos arquitectónicos más importantes para sistemas distribuidos según la clase?',
 o:['Arquitecturas en capas','Arquitecturas centradas en recursos','Arquitecturas basadas en hilos','Arquitecturas basadas en eventos'],a:2,
 w:'Los cuatro: en capas, basadas en objetos, centradas en recursos y basadas en eventos.',
 n:['Sí es estilo.','Sí es estilo.',null,'Sí es estilo.'],src:'CEN-03 · Arquitecturas'},
{t:'AR',s:'alias',q:'En las arquitecturas en capas, la llamada excepcional que un componente hace a una capa de nivel SUPERIOR se conoce como:',

 n:['Downcall es la llamada descendente normal.',null,'Término plausible pero no es el de la clase.','Una interrupción es un mecanismo de hardware o del SO.'],src:'CEN-03 · Arquitecturas en capas',g:'capas'},
{t:'AR',s:'casi',q:'Organización en capas donde una capa puede llamar a capas que no están inmediatamente debajo de ella.',

const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const K = C.key;
let stats = store.get(K+'-stats', {});
let prefs = store.get(K+'-prefs-v2', {pen:C.defaultPen, extra:C.extraDefault});
if(!C.pens.includes(prefs.pen)) prefs.pen = C.defaultPen;
function record(id, ok){
  const s = stats[id] || {c:0,w:0,b:0};
  if(ok){ s.c++; s.b = Math.min(s.b+1,3); } else { s.w++; s.b = 0; }
  stats[id] = s; store.set(K+'-stats', stats); renderLegend();

const penText = p => p === 0 ? 'Sin factor de corrección' : `Para respuestas incorrectas el factor de corrección es −${p} pto${p>1?'s':''}.`;

/* ---------- utilidades ---------- */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r){ r = r || Math.random; const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function pool(includeExtra){ return BANK.filter(q => includeExtra || !q.x); }
function inst(q, r){ return {q, order: shuffle([0,1,2,3], r), choice:null, conf:null}; }

/* Arma un parcial de 10 balanceado por tema, como hace el profesor (cubre todo el temario) */
function buildExam(seed, includeExtra){
  const r = seed == null ? Math.random : rng(seed);
  const byT = {};
  shuffle(pool(includeExtra), r).forEach(q => (byT[q.t] = byT[q.t] || []).push(q));
  const topics = shuffle(Object.keys(byT), r);
  const out = []; let k = 0;
  while(out.length < 10){ const t = topics[k % topics.length]; const q = byT[t].shift(); if(q) out.push(q); k++; if(k > 400) break; }
  return shuffle(out, r).map(q => inst(q, r));
}

function renderLegend(){
  const seen = Object.keys(stats).length;
  const errs = Object.values(stats).filter(s => s.w > 0 && s.b < 2).length;
  document.getElementById('legend').innerHTML =
    `<div><b>${BANK.length}</b> preguntas en el banco</div><div><b>${seen}</b> vistas · <b>${errs}</b> por repasar</div>`;
}

/* ---------- render de una pregunta ---------- */
function optHTML(it, pos, origIdx, state){
  const cls = ['opt'];
  if(state === 'answer' && it.choice === origIdx) cls.push('sel');
  if(state === 'review'){
    if(origIdx === it.q.a) cls.push('right');
    else if(it.choice === origIdx) cls.push('wrong');
  }
  return `<button class="${cls.join(' ')}" data-orig="${origIdx}" ${state==='review'?'disabled':''}><span class="box">[ ${pos+1} ]</span><span>${esc(it.q.o[origIdx])}</span></button>`;
}
function metaChips(q){
  const c = [`<span class="chip">${esc(TOPICS[q.t])}</span>`];
  if(q.s === 'casi' || q.s === 'alias') c.push(`<span class="chip trap">${esc(STYLES[q.s])}</span>`);
  else c.push(`<span class="chip">${esc(STYLES[q.s])}</span>`);
  if(q.x) c.push(`<span class="chip extra">${esc((C.xChip && C.xChip[q.t]) || C.xChipDefault || 'Extra')}</span>`);
  return `<div class="chips">${c.join('')}</div>`;
}
function feedbackHTML(it, pen){
  const q = it.q, ok = it.choice === q.a, blank = it.choice == null;
  const pos = o => it.order.indexOf(o) + 1;
  let verdict, cls;
  if(blank){ verdict = 'En blanco · 0 pts'; cls = 'blank'; }
  else if(ok){ verdict = pen != null ? 'Correcta · +2 pts' : 'Correcta'; cls = 'ok'; }
  else { verdict = pen != null ? `Incorrecta · ${pen ? '−'+pen : 0} pts` : 'Incorrecta'; cls = 'bad'; }
  const others = it.order.filter(o => o !== q.a).map(o =>
    `<li class="${o===it.choice?'mine':''}"><b>[ ${pos(o)} ] ${esc(q.o[o])}:</b> ${esc(q.n[o])}</li>`).join('');
  const mine = (!blank && !ok) ? `<div><b>Por qué no era [ ${pos(it.choice)} ] ${esc(q.o[it.choice])}:</b> ${esc(q.n[it.choice])}</div>` : '';
  return `<div class="fb">
    <div class="verdict ${cls}">${verdict}</div>
    <div class="why"><b>Respuesta: [ ${pos(q.a)} ] ${esc(q.o[q.a])}.</b> ${esc(q.w)}</div>
    ${mine}
    <details ${(!blank && !ok) ? '' : ''}><summary>Por qué no son las otras opciones</summary><ul>${others}</ul></details>
    <div class="src">Fuente: ${esc(q.src)}</div>
  </div>`;
}

function startSim(seed, name){

function viewSim(){

  s.items.forEach((it, n) => {

    const q = el(`<div class="q">

        <button class="c-doubt" aria-pressed="${it.choice!=null && it.conf==='doubt'}" data-c="doubt">Dudo</button>
        <button class="c-blank" aria-pressed="${it.choice==null}" data-c="blank">Dejar en blanco</button></div>`}
    </div>`);
    if(!s.done){
      q.querySelectorAll('.opt').forEach(b => b.onclick = () => { it.choice = +b.dataset.orig; if(!it.conf) it.conf = 'sure'; refreshQ(q, it); updateBar(); });
      q.querySelectorAll('.conf button').forEach(b => b.onclick = () => {
        if(b.dataset.c === 'blank'){ it.choice = null; it.conf = null; }
        else { it.conf = b.dataset.c; }

      });
    }
    qs.appendChild(q);
  });
  app.appendChild(sheet);
  if(!s.done){
    const bar = el(`<div class="sticky-bar"><span class="mono muted" id="sb-count"></span><div class="row"><button class="btn ghost" id="sb-quit">Salir</button><button class="btn primary" id="sb-grade">Corregir parcial</button></div></div>`);
    bar.querySelector('#sb-quit').onclick = () => { sim = null; viewSimSetup(); };

function refreshQ(node, it){
  node.querySelectorAll('.opt').forEach(b => b.classList.toggle('sel', +b.dataset.orig === it.choice));
  node.querySelectorAll('.conf button').forEach(b => {
    const c = b.dataset.c;
    b.setAttribute('aria-pressed', c === 'blank' ? it.choice == null : (it.choice != null && it.conf === c));
  });
}
function updateBar(){
  const n = sim.items.filter(i => i.choice != null).length;
  const c = document.getElementById('sb-count'); if(c) c.textContent = `${n}/10 respondidas · ${10-n} en blanco`;
}
function gradeSim(){
  sim.done = true;
  sim.items.forEach(it => { if(it.choice != null) record(it.q.id, it.choice === it.q.a); });
  const sc = scoreOf(sim);
  if(sim.seed != null){ const k = K+'-best-'+sim.name+(sim.extra?'x':''); const b = store.get(k, null); if(b == null || sc.total > b) store.set(k, sc.total); }
  viewSim(); window.scrollTo({top:0});
}
function scoreOf(s){
  let total = 0, ok = 0, bad = 0, blank = 0, sure = {n:0,ok:0}, doubt = {n:0,ok:0}, ifBlankDoubt = 0;
  s.items.forEach(it => {
    if(it.choice == null){ blank++; return; }
    const good = it.choice === it.q.a, pts = good ? 2 : -s.pen;
    total += pts; good ? ok++ : bad++;
    const bucket = it.conf === 'doubt' ? doubt : sure; bucket.n++; if(good) bucket.ok++;
    if(it.conf !== 'doubt') ifBlankDoubt += pts;
  });
  return {total, ok, bad, blank, sure, doubt, ifBlankDoubt};
}
function resultsPanel(){
  const r = scoreOf(sim), pen = sim.pen;
  const pct = x => x.n ? Math.round(100*x.ok/x.n)+'%' : '—';
  const be = Math.round(100*pen/(2+pen)); // acierto mínimo para que arriesgar no reste
  let advice;
  if(pen === 0) advice = `Sin factor de corrección, una respuesta en blanco nunca suma. <b>Respondé siempre</b>, aunque dudes. Cuando dudaste acertaste ${pct(r.doubt)}.`;
  else if(r.doubt.n === 0) advice = `No marcaste ninguna como <b>Dudo</b>. La próxima vez marcalas: así medimos si te conviene arriesgar.`;
  else if(r.ifBlankDoubt > r.total) advice = `Cuando dudaste acertaste ${pct(r.doubt)}. Con factor −${pen} necesitás más de ${be}% para que arriesgar sume. <b>Si hubieras dejado en blanco las dudosas sacabas ${r.ifBlankDoubt}/20 en vez de ${r.total}/20.</b>`;
  else if(r.ifBlankDoubt === r.total) advice = `Cuando dudaste acertaste ${pct(r.doubt)}, justo en el ${be}% donde arriesgar no suma ni resta: ${r.total}/20 en ambos casos. <b>Con más dudas que aciertos, conviene dejar en blanco.</b>`;
  else advice = `Cuando dudaste acertaste ${pct(r.doubt)}, por encima del ${be}% que hace falta con factor −${pen}. <b>Arriesgar te sumó</b>: ${r.total}/20 contra ${r.ifBlankDoubt}/20 si las dejabas en blanco.`;
  const weak = {};
  sim.items.forEach(it => { if(it.choice !== it.q.a) weak[it.q.t] = (weak[it.q.t]||0)+1; });
  const weakList = Object.entries(weak).sort((a,b)=>b[1]-a[1]).map(([t])=>t);
  const p = el(`<section class="sheet stack" style="margin-bottom:16px">
    <div class="score">
      <div class="big">${r.total}<small>/20</small></div>
      <div class="kv">
        <div class="ok"><div class="k">Correctas</div><div class="v">${r.ok} · +${r.ok*2}</div></div>
        <div class="bad"><div class="k">Incorrectas</div><div class="v">${r.bad}${pen ? ' · −'+(r.bad*pen) : ''}</div></div>
        <div><div class="k">En blanco</div><div class="v">${r.blank}</div></div>
        <div class="doubt"><div class="k">Acierto si dudabas</div><div class="v">${pct(r.doubt)}</div></div>
        <div class="ok"><div class="k">Acierto si estabas seguro</div><div class="v">${pct(r.sure)}</div></div>
      </div>
    </div>
    <div class="advice">${advice}</div>
    ${weakList.length ? `<div class="row"><span class="muted">Repasá:</span>${weakList.map(t=>`<button class="btn" data-t="${t}">${esc(TOPICS[t])}</button>`).join('')}</div>` : ''}
    <div class="row"><button class="btn primary" id="again">Otro parcial</button><button class="btn" id="redo">Repetir este modelo</button></div>
  </section>`);
  p.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { setMode('prac'); startPractice(BANK.filter(q=>q.t===b.dataset.t).map(q=>q.id), TOPICS[b.dataset.t]); });
  p.querySelector('#again').onclick = () => { sim = null; viewSimSetup(); };
  p.querySelector('#redo').onclick = () => startSim(sim.seed, sim.name);
  return p;
}

        <div class="tbl"><table><thead><tr>${c.cols.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${c.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
        ${n ? `<div class="row"><button class="btn" data-g="${c.g}" data-title="${esc(c.title)}">Ponerme a prueba · ${n} preguntas</button></div>` : ''}
      </section>`; }).join('')}
  </div>`);
  v.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { setMode('prac', true); startPractice(BANK.filter(q=>q.g===b.dataset.g).map(q=>q.id), b.dataset.title); });
  v.querySelectorAll('.toc a').forEach(a => a.onclick = e => { e.preventDefault(); const t = document.getElementById(a.getAttribute('href').slice(1)); if(t) t.scrollIntoView({behavior:'smooth'}); });
  app.appendChild(v);
}

/* ---------- MODO CÓMO ESTUDIAR ---------- */
function viewHow(){
  app.innerHTML = '';
  const ev = (k, pen) => { const p = 1/k; return 2*p - pen*(1-p); };
  const fmt = x => { const r = Math.round(x*100)/100; const c = Math.abs(r) < 0.01 ? 'zero' : r > 0 ? 'pos' : 'neg'; return `<span class="${c}">${r > 0 ? '+' : ''}${r.toFixed(2)}</span>`; };
  const v = el(`<div class="stack">
    <section class="sheet stack">
      <h2>El método</h2>
      <p class="muted" style="max-width:68ch">${esc(C.methodLead)}</p>
      <ol class="steps">
        <li><div><b>Diagnóstico.</b> Hacé un simulacro en frío antes de repasar. Marcá Seguro o Dudo con honestidad. La nota importa menos que saber dónde estás.</div></li>
        <li><div><b>Contraste.</b> Por cada tema que falló, abrí su tabla en <i>Contrastes</i>. La pregunta que tenés que poder responder es "¿qué palabra del enunciado delata a esta opción y no a su vecina?".</div></li>
        <li><div><b>Práctica con feedback.</b> Hacé la práctica de ese tema. Cuando falles, leé por qué tu opción no era antes de mirar la correcta.</div></li>
        <li><div><b>Repaso espaciado.</b> Volvé a <i>Mis errores</i> horas después, y otra vez al día siguiente. Las opciones cambian de orden en cada intento, así que no podés memorizar posiciones.</div></li>
        <li><div><b>Simulacro final.</b> Hacé un modelo fijo que no hayas visto, con el factor de corrección real, y decidí qué dejar en blanco según tu acierto en las dudosas.</div></li>
      </ol>
    </section>
    <section class="sheet stack">
      <h2>¿Arriesgar o dejar en blanco?</h2>
      <p class="muted" style="max-width:68ch">Puntos esperados por pregunta según cuántas opciones te quedan después de descartar. Una respuesta correcta vale +2.</p>
      <div class="tbl"><table class="ev mono"><thead><tr><th>Opciones que quedan</th>${[2,1,0].map(p=>`<th>${p?'Factor −'+p:'Sin resta'}</th>`).join('')}</tr></thead><tbody>
        ${[4,3,2].map(k=>`<tr><td>${k} (${k===4?'no descarto ninguna':'descarto '+(4-k)})</td>${[2,1,0].map(p=>`<td>${fmt(ev(k,p))}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>
      <p style="max-width:68ch">Con <b>−2</b>, adivinar entre 4 te quita 1 punto en promedio, y con 2 opciones quedás en cero. Solo conviene responder si tu acierto supera el 50%. Con <b>−1</b> conviene arriesgar si lograste descartar al menos una opción. <b>Sin resta</b>, nunca dejes nada en blanco.</p>
    </section>
    <section class="sheet stack">
      <h2>${esc(C.howTitle)}</h2>
      <ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:68ch">
        ${C.howAsk.map(([b,t])=>`<li><b>${esc(b)}</b> ${esc(t)}</li>`).join('')}
      </ul>
    </section>
  </div>`);
  app.appendChild(v);
}

/* ---------- navegación ---------- */
let mode = 'sim';
function setMode(m, keep){
  mode = m;
  document.querySelectorAll('nav.modes button').forEach(b => b.setAttribute('aria-selected', b.dataset.mode === m));
  store.set(K+'-mode', m);
  if(!keep) render();
}
function render(){
  if(mode === 'sim') sim ? viewSim() : viewSimSetup();
  else if(mode === 'prac') prac ? viewPrac() : viewPracSetup();
  else if(mode === 'err') viewErr();
  else if(mode === 'cmp') viewCmp();
  else viewHow();
}
document.querySelectorAll('nav.modes button').forEach(b => b.onclick = () => {
  if(b.dataset.mode === 'prac' && mode === 'prac') prac = null;
  if(b.dataset.mode === 'sim' && mode === 'sim' && sim && sim.done) sim = null;
  setMode(b.dataset.mode);
});
const hash = (location.hash || '').slice(1);
mode = ['sim','prac','err','cmp','how'].includes(hash) ? hash : store.get(K+'-mode', 'sim');
setMode(mode);
renderLegend();
})();
</script>
