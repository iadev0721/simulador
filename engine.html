<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: hoja de examen centrada sobre papel azul frío; barra de modos arriba; opciones en grilla 2×2 como en las hojas del profesor */
:root{
  --bg:#e9edf3; --paper:#ffffff; --ink:#18202c; --muted:#5a6575; --line:#d3dae4; --soft:#f3f6fa;
  --accent:#1e4fa3; --accent-ink:#ffffff; --accent-soft:#e3ebf8;
  --ok:#1d7f48; --ok-soft:#e2f3e9; --bad:#b8322a; --bad-soft:#f9e4e2; --doubt:#a06a00; --doubt-soft:#fbf0d9;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131b; --paper:#161d28; --ink:#e4e9f1; --muted:#97a2b3; --line:#2a3443; --soft:#1c2533;
  --accent:#7ea4ff; --accent-ink:#0e131b; --accent-soft:#1e2b44;
  --ok:#55c486; --ok-soft:#163224; --bad:#ff7b70; --bad-soft:#3a1c1a; --doubt:#f0bf52; --doubt-soft:#382c12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131b; --paper:#161d28; --ink:#e4e9f1; --muted:#97a2b3; --line:#2a3443; --soft:#1c2533;
  --accent:#7ea4ff; --accent-ink:#0e131b; --accent-soft:#1e2b44;
  --ok:#55c486; --ok-soft:#163224; --bad:#ff7b70; --bad-soft:#3a1c1a; --doubt:#f0bf52; --doubt-soft:#382c12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
header.top .sub{color:var(--muted);margin-top:4px;max-width:60ch}
.legend{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);text-align:right}
.legend b{color:var(--ink)}
nav.modes{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:none}
nav.modes button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:600 .95rem var(--f-body);padding:10px 12px;cursor:pointer}
nav.modes button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.modes button:hover{color:var(--ink)}
button{font-family:var(--f-body)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:9px 14px;font-weight:700;font-size:.95rem;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px clamp(16px,3vw,28px)}
.sheet-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;border-bottom:1px dashed var(--line);padding-bottom:12px;margin-bottom:6px}
.sheet-head .uni{font-size:.85rem;color:var(--muted);line-height:1.35}
.sheet-head .uni b{color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.03em;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.extra{background:var(--doubt-soft);color:var(--doubt);border-color:transparent}
.chip.trap{background:var(--accent-soft);color:var(--accent);border-color:transparent}
/* Pregunta */
.q{padding:18px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q-stem{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:1.05rem}
.q-num{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.q-meta{grid-column:2;margin-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin:14px 0 0;padding-left:calc(1ch + 26px)}
@media (max-width:620px){.opts{grid-template-columns:1fr;padding-left:0}}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:.98rem;line-height:1.35}
.opt:hover:not(:disabled){background:var(--soft);border-color:var(--line)}
.opt .box{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);white-space:nowrap;padding-top:1px}
.opt.sel{background:var(--accent-soft);border-color:var(--accent)}
.opt.sel .box{color:var(--accent);font-weight:600}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right .box{color:var(--ok);font-weight:600}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .box{color:var(--bad);font-weight:600}
.opt:disabled{cursor:default}
.conf{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding-left:calc(1ch + 26px)}
@media (max-width:620px){.conf{padding-left:0}}
.conf button{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:.82rem;cursor:pointer}
.conf button[aria-pressed="true"].c-sure{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.conf button[aria-pressed="true"].c-doubt{background:var(--doubt-soft);color:var(--doubt);border-color:var(--doubt)}
.conf button[aria-pressed="true"].c-blank{background:var(--soft);color:var(--ink);border-color:var(--ink)}
/* Feedback */
.fb{margin-top:14px;border-radius:8px;border:1px solid var(--line);background:var(--soft);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.fb .verdict{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.fb .verdict.ok{color:var(--ok)} .fb .verdict.bad{color:var(--bad)} .fb .verdict.blank{color:var(--muted)}
.fb .why b{font-weight:700}
.fb ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.fb li{color:var(--muted)} .fb li b{color:var(--ink)}
.fb li.mine{color:var(--ink)}
.fb .src{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
details summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:.9rem}
/* Paneles */
.panel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-weight:700;font-size:.9rem}
select,input[type="number"]{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--paper);color:var(--muted);padding:8px 12px;font-weight:700;cursor:pointer;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;color:var(--muted)}
.check input{margin-top:4px}
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.model{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer;color:var(--ink)}
.model:hover{border-color:var(--accent)}
.model .mono{font-size:.75rem;color:var(--muted)}
.model b{font-family:var(--f-display);font-size:1.05rem;display:block}
/* Resultados */
.score{display:grid;grid-template-columns:auto 1fr;gap:6px 24px;align-items:center}
@media (max-width:560px){.score{grid-template-columns:1fr}}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(3rem,10vw,4.4rem);line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:var(--muted);font-weight:500}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kv div{border-left:3px solid var(--line);padding:2px 0 2px 10px}
.kv .k{font-size:.78rem;color:var(--muted)}
.kv .v{font-family:var(--f-mono);font-weight:600;font-size:1.1rem}
.kv .ok{border-color:var(--ok)} .kv .bad{border-color:var(--bad)} .kv .doubt{border-color:var(--doubt)}
.advice{border-radius:8px;padding:12px 14px;background:var(--accent-soft);color:var(--ink)}
.advice b{color:var(--accent)}
/* Barras de dominio */
.mastery{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 64px;gap:10px;align-items:center;font-size:.9rem}
@media (max-width:520px){.mrow{grid-template-columns:minmax(0,1fr) 80px 56px}}
.bar{height:8px;border-radius:99px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.mrow .mono{font-size:.8rem;color:var(--muted);text-align:right}
.mrow button{all:unset;cursor:pointer;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow button:hover{color:var(--accent);text-decoration:underline}
/* Contrastes */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--soft);font-weight:600}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700}
.cgroup{display:flex;flex-direction:column;gap:10px}
.cgroup .lead{color:var(--muted);max-width:68ch}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{color:var(--accent);font-size:.85rem;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--paper)}
.toc a:hover{border-color:var(--accent)}
/* Estrategia */
.ev td,.ev th{text-align:center} .ev td:first-child{text-align:left}
.pos{color:var(--ok);font-weight:700} .neg{color:var(--bad);font-weight:700} .zero{color:var(--doubt);font-weight:700}
.steps{display:grid;gap:12px;counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{display:grid;grid-template-columns:2.2rem 1fr;gap:12px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:var(--accent);border:2px solid var(--accent);border-radius:50%;width:2.2rem;height:2.2rem;display:grid;place-items:center}
.progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.muted{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.sticky-bar{position:sticky;bottom:0;margin-top:16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="h-eyebrow"></div>
      <h1 id="h-title"></h1>
      <p class="sub" id="h-sub"></p>
    </div>
    <div class="legend" id="legend"></div>
  </header>

  <nav class="modes" role="tablist" aria-label="Modos de estudio">
    <button role="tab" data-mode="sim" aria-selected="true">Simulacro</button>
    <button role="tab" data-mode="prac" aria-selected="false">Práctica por tema</button>
    <button role="tab" data-mode="err" aria-selected="false">Mis errores</button>
    <button role="tab" data-mode="cmp" aria-selected="false">Contrastes</button>
    <button role="tab" data-mode="how" aria-selected="false">Cómo estudiar</button>
  </nav>

  <main id="app" aria-live="polite"></main>
</div>

<script src="banco.js"></script>
<script>
(function(){
const BANK = window.BANK.map((q,i)=>Object.assign({id:i},q));
const TOPICS = window.TOPICS, STYLES = window.STYLES, CONTRASTS = window.CONTRASTS, C = window.COURSE;
const app = document.getElementById('app');
document.getElementById('h-eyebrow').textContent = C.eyebrow;
document.getElementById('h-title').textContent = C.title;
document.getElementById('h-sub').textContent = C.sub;

/* ---------- almacenamiento local (opcional) ---------- */
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const K = C.key;
let stats = store.get(K+'-stats', {});
let prefs = store.get(K+'-prefs-v2', {pen:C.defaultPen, extra:C.extraDefault});
if(!C.pens.includes(prefs.pen)) prefs.pen = C.defaultPen;
function record(id, ok){
  const s = stats[id] || {c:0,w:0,b:0};
  if(ok){ s.c++; s.b = Math.min(s.b+1,3); } else { s.w++; s.b = 0; }
  stats[id] = s; store.set(K+'-stats', stats); renderLegend();
}
function savePrefs(){ store.set(K+'-prefs-v2', prefs); }
const penText = p => p === 0 ? 'Sin factor de corrección' : `Para respuestas incorrectas el factor de corrección es −${p} pto${p>1?'s':''}.`;

/* ---------- utilidades ---------- */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r){ r = r || Math.random; const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function pool(includeExtra){ return BANK.filter(q => includeExtra || !q.x); }
function inst(q, r){ return {q, order: shuffle([0,1,2,3], r), choice:null, conf:null}; }

/* Arma un parcial de 10 balanceado por tema, como hace el profesor (cubre todo el temario) */
function buildExam(seed, includeExtra){
  const r = seed == null ? Math.random : rng(seed);
  const byT = {};
  shuffle(pool(includeExtra), r).forEach(q => (byT[q.t] = byT[q.t] || []).push(q));
  const topics = shuffle(Object.keys(byT), r);
  const out = []; let k = 0;
  while(out.length < 10){ const t = topics[k % topics.length]; const q = byT[t].shift(); if(q) out.push(q); k++; if(k > 400) break; }
  return shuffle(out, r).map(q => inst(q, r));
}

function renderLegend(){
  const seen = Object.keys(stats).length;
  const errs = Object.values(stats).filter(s => s.w > 0 && s.b < 2).length;
  document.getElementById('legend').innerHTML =
    `<div><b>${BANK.length}</b> preguntas en el banco</div><div><b>${seen}</b> vistas · <b>${errs}</b> por repasar</div>`;
}

/* ---------- render de una pregunta ---------- */
function optHTML(it, pos, origIdx, state){
  const cls = ['opt'];
  if(state === 'answer' && it.choice === origIdx) cls.push('sel');
  if(state === 'review'){
    if(origIdx === it.q.a) cls.push('right');
    else if(it.choice === origIdx) cls.push('wrong');
  }
  return `<button class="${cls.join(' ')}" data-orig="${origIdx}" ${state==='review'?'disabled':''}><span class="box">[ ${pos+1} ]</span><span>${esc(it.q.o[origIdx])}</span></button>`;
}
function metaChips(q){
  const c = [`<span class="chip">${esc(TOPICS[q.t])}</span>`];
  if(q.s === 'casi' || q.s === 'alias') c.push(`<span class="chip trap">${esc(STYLES[q.s])}</span>`);
  else c.push(`<span class="chip">${esc(STYLES[q.s])}</span>`);
  if(q.x) c.push(`<span class="chip extra">${esc((C.xChip && C.xChip[q.t]) || C.xChipDefault || 'Extra')}</span>`);
  return `<div class="chips">${c.join('')}</div>`;
}
function feedbackHTML(it, pen){
  const q = it.q, ok = it.choice === q.a, blank = it.choice == null;
  const pos = o => it.order.indexOf(o) + 1;
  let verdict, cls;
  if(blank){ verdict = 'En blanco · 0 pts'; cls = 'blank'; }
  else if(ok){ verdict = pen != null ? 'Correcta · +2 pts' : 'Correcta'; cls = 'ok'; }
  else { verdict = pen != null ? `Incorrecta · ${pen ? '−'+pen : 0} pts` : 'Incorrecta'; cls = 'bad'; }
  const others = it.order.filter(o => o !== q.a).map(o =>
    `<li class="${o===it.choice?'mine':''}"><b>[ ${pos(o)} ] ${esc(q.o[o])}:</b> ${esc(q.n[o])}</li>`).join('');
  const mine = (!blank && !ok) ? `<div><b>Por qué no era [ ${pos(it.choice)} ] ${esc(q.o[it.choice])}:</b> ${esc(q.n[it.choice])}</div>` : '';
  return `<div class="fb">
    <div class="verdict ${cls}">${verdict}</div>
    <div class="why"><b>Respuesta: [ ${pos(q.a)} ] ${esc(q.o[q.a])}.</b> ${esc(q.w)}</div>
    ${mine}
    <details ${(!blank && !ok) ? '' : ''}><summary>Por qué no son las otras opciones</summary><ul>${others}</ul></details>
    <div class="src">Fuente: ${esc(q.src)}</div>
  </div>`;
}

/* ---------- MODO SIMULACRO ---------- */
let sim = null;
function viewSimSetup(){
  const models = ['A','B','C','D','E','F','G','H'];
  app.innerHTML = '';
  const v = el(`<div class="stack">
    <section class="sheet stack">
      <div>
        <h2>Simulacro de 10 preguntas</h2>
        <p class="muted" style="margin-top:6px;max-width:66ch">${esc(C.simIntro)}</p>
      </div>
      <div class="panel-grid">
        <div class="field"><span class="lbl">Factor de corrección</span>
          <div class="seg" role="group" aria-label="Factor de corrección">
            ${C.pens.map(p=>`<button data-pen="${p}" aria-pressed="${prefs.pen===p}">${p===0?'Sin resta':'−'+p+(p>1?' pts':' pto')}</button>`).join('')}
          </div>
          <span class="muted" style="font-size:.82rem">${esc(C.penNote)}</span>
        </div>
        ${C.extraLabel ? `<div class="field"><span class="lbl">Temario</span>
          <label class="check"><input type="checkbox" id="opt-extra" ${prefs.extra?'checked':''}> ${esc(C.extraLabel)}</label>
        </div>` : ''}
      </div>
      <div class="row"><button class="btn primary" id="go-random">Generar parcial aleatorio</button></div>
    </section>
    <section class="stack">
      <div><h3>Modelos fijos</h3><p class="muted" style="margin-top:4px">Siempre salen las mismas preguntas, para repetir un modelo después de estudiar y comparar tu nota.</p></div>
      <div class="models">${models.map((m,i)=>{ const best = store.get(K+'-best-'+m+(prefs.extra?'x':''), null);
        return `<button class="model" data-seed="${(i+1)*7919}" data-name="${m}"><b>Modelo ${m}</b><span class="mono">${best==null?'sin intentar':'mejor: '+best+'/20'}</span></button>`; }).join('')}</div>
    </section>
  </div>`);
  v.querySelectorAll('[data-pen]').forEach(b => b.onclick = () => { prefs.pen = +b.dataset.pen; savePrefs(); viewSimSetup(); });
  if(C.extraLabel) v.querySelector('#opt-extra').onchange = e => { prefs.extra = e.target.checked; savePrefs(); viewSimSetup(); };
  v.querySelector('#go-random').onclick = () => startSim(null, 'Aleatorio');
  v.querySelectorAll('.model').forEach(b => b.onclick = () => startSim(+b.dataset.seed, b.dataset.name));
  app.appendChild(v);
}
function startSim(seed, name){
  sim = {name, seed, pen: prefs.pen, extra: prefs.extra, items: buildExam(seed, prefs.extra), done:false};
  viewSim(); window.scrollTo({top:0});
}
function viewSim(){
  const s = sim;
  app.innerHTML = '';
  const answered = s.items.filter(i => i.choice != null).length;
  const sheet = el(`<section class="sheet">
    <div class="sheet-head">
      <div class="uni"><b>${esc(C.uni)}</b><br>${esc(C.sheetCourse)} · ${s.name==='Aleatorio'?'Modelo aleatorio':'Modelo '+esc(s.name)}</div>
      <div class="uni mono" style="text-align:right">${s.done ? 'Corregido' : answered+'/10 respondidas'}</div>
    </div>
    <div id="qs"></div>
    <p class="mono muted" style="font-size:.85rem;margin-top:12px">2 ptos C/U. ${penText(s.pen)}</p>
  </section>`);
  const qs = sheet.querySelector('#qs');
  s.items.forEach((it, n) => {
    const state = s.done ? 'review' : 'answer';
    const q = el(`<div class="q">
      <div class="q-stem"><span class="q-num">${n+1}.</span><span>${esc(it.q.q)}</span>${s.done?`<div class="q-meta">${metaChips(it.q)}</div>`:''}</div>
      <div class="opts">${it.order.map((o,p)=>optHTML(it,p,o,state)).join('')}</div>
      ${s.done ? feedbackHTML(it, s.pen) : `<div class="conf" role="group" aria-label="Confianza">
        <button class="c-sure" aria-pressed="${it.choice!=null && it.conf==='sure'}" data-c="sure">Seguro</button>
        <button class="c-doubt" aria-pressed="${it.choice!=null && it.conf==='doubt'}" data-c="doubt">Dudo</button>
        <button class="c-blank" aria-pressed="${it.choice==null}" data-c="blank">Dejar en blanco</button></div>`}
    </div>`);
    if(!s.done){
      q.querySelectorAll('.opt').forEach(b => b.onclick = () => { it.choice = +b.dataset.orig; if(!it.conf) it.conf = 'sure'; refreshQ(q, it); updateBar(); });
      q.querySelectorAll('.conf button').forEach(b => b.onclick = () => {
        if(b.dataset.c === 'blank'){ it.choice = null; it.conf = null; }
        else { it.conf = b.dataset.c; }
        refreshQ(q, it); updateBar();
      });
    }
    qs.appendChild(q);
  });
  app.appendChild(sheet);
  if(!s.done){
    const bar = el(`<div class="sticky-bar"><span class="mono muted" id="sb-count"></span><div class="row"><button class="btn ghost" id="sb-quit">Salir</button><button class="btn primary" id="sb-grade">Corregir parcial</button></div></div>`);
    bar.querySelector('#sb-quit').onclick = () => { sim = null; viewSimSetup(); };
    bar.querySelector('#sb-grade').onclick = gradeSim;
    app.appendChild(bar); updateBar();
  } else {
    app.insertBefore(resultsPanel(), sheet);
  }
}
function refreshQ(node, it){
  node.querySelectorAll('.opt').forEach(b => b.classList.toggle('sel', +b.dataset.orig === it.choice));
  node.querySelectorAll('.conf button').forEach(b => {
    const c = b.dataset.c;
    b.setAttribute('aria-pressed', c === 'blank' ? it.choice == null : (it.choice != null && it.conf === c));
  });
}
function updateBar(){
  const n = sim.items.filter(i => i.choice != null).length;
  const c = document.getElementById('sb-count'); if(c) c.textContent = `${n}/10 respondidas · ${10-n} en blanco`;
}
function gradeSim(){
  sim.done = true;
  sim.items.forEach(it => { if(it.choice != null) record(it.q.id, it.choice === it.q.a); });
  const sc = scoreOf(sim);
  if(sim.seed != null){ const k = K+'-best-'+sim.name+(sim.extra?'x':''); const b = store.get(k, null); if(b == null || sc.total > b) store.set(k, sc.total); }
  viewSim(); window.scrollTo({top:0});
}
function scoreOf(s){
  let total = 0, ok = 0, bad = 0, blank = 0, sure = {n:0,ok:0}, doubt = {n:0,ok:0}, ifBlankDoubt = 0;
  s.items.forEach(it => {
    if(it.choice == null){ blank++; return; }
    const good = it.choice === it.q.a, pts = good ? 2 : -s.pen;
    total += pts; good ? ok++ : bad++;
    const bucket = it.conf === 'doubt' ? doubt : sure; bucket.n++; if(good) bucket.ok++;
    if(it.conf !== 'doubt') ifBlankDoubt += pts;
  });
  return {total, ok, bad, blank, sure, doubt, ifBlankDoubt};
}
function resultsPanel(){
  const r = scoreOf(sim), pen = sim.pen;
  const pct = x => x.n ? Math.round(100*x.ok/x.n)+'%' : '—';
  const be = Math.round(100*pen/(2+pen)); // acierto mínimo para que arriesgar no reste
  let advice;
  if(pen === 0) advice = `Sin factor de corrección, una respuesta en blanco nunca suma. <b>Respondé siempre</b>, aunque dudes. Cuando dudaste acertaste ${pct(r.doubt)}.`;
  else if(r.doubt.n === 0) advice = `No marcaste ninguna como <b>Dudo</b>. La próxima vez marcalas: así medimos si te conviene arriesgar.`;
  else if(r.ifBlankDoubt > r.total) advice = `Cuando dudaste acertaste ${pct(r.doubt)}. Con factor −${pen} necesitás más de ${be}% para que arriesgar sume. <b>Si hubieras dejado en blanco las dudosas sacabas ${r.ifBlankDoubt}/20 en vez de ${r.total}/20.</b>`;
  else if(r.ifBlankDoubt === r.total) advice = `Cuando dudaste acertaste ${pct(r.doubt)}, justo en el ${be}% donde arriesgar no suma ni resta: ${r.total}/20 en ambos casos. <b>Con más dudas que aciertos, conviene dejar en blanco.</b>`;
  else advice = `Cuando dudaste acertaste ${pct(r.doubt)}, por encima del ${be}% que hace falta con factor −${pen}. <b>Arriesgar te sumó</b>: ${r.total}/20 contra ${r.ifBlankDoubt}/20 si las dejabas en blanco.`;
  const weak = {};
  sim.items.forEach(it => { if(it.choice !== it.q.a) weak[it.q.t] = (weak[it.q.t]||0)+1; });
  const weakList = Object.entries(weak).sort((a,b)=>b[1]-a[1]).map(([t])=>t);
  const p = el(`<section class="sheet stack" style="margin-bottom:16px">
    <div class="score">
      <div class="big">${r.total}<small>/20</small></div>
      <div class="kv">
        <div class="ok"><div class="k">Correctas</div><div class="v">${r.ok} · +${r.ok*2}</div></div>
        <div class="bad"><div class="k">Incorrectas</div><div class="v">${r.bad}${pen ? ' · −'+(r.bad*pen) : ''}</div></div>
        <div><div class="k">En blanco</div><div class="v">${r.blank}</div></div>
        <div class="doubt"><div class="k">Acierto si dudabas</div><div class="v">${pct(r.doubt)}</div></div>
        <div class="ok"><div class="k">Acierto si estabas seguro</div><div class="v">${pct(r.sure)}</div></div>
      </div>
    </div>
    <div class="advice">${advice}</div>
    ${weakList.length ? `<div class="row"><span class="muted">Repasá:</span>${weakList.map(t=>`<button class="btn" data-t="${t}">${esc(TOPICS[t])}</button>`).join('')}</div>` : ''}
    <div class="row"><button class="btn primary" id="again">Otro parcial</button><button class="btn" id="redo">Repetir este modelo</button></div>
  </section>`);
  p.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { setMode('prac'); startPractice(BANK.filter(q=>q.t===b.dataset.t).map(q=>q.id), TOPICS[b.dataset.t]); });
  p.querySelector('#again').onclick = () => { sim = null; viewSimSetup(); };
  p.querySelector('#redo').onclick = () => startSim(sim.seed, sim.name);
  return p;
}

/* ---------- MODO PRÁCTICA (feedback inmediato) ---------- */
let prac = null;
function viewPracSetup(){
  app.innerHTML = '';
  const rows = Object.keys(TOPICS).map(t => {
    const qs = BANK.filter(q => q.t === t);
    const seen = qs.filter(q => stats[q.id]);
    const mastered = qs.filter(q => stats[q.id] && stats[q.id].b >= 2).length;
    const pc = Math.round(100*mastered/qs.length);
    return `<div class="mrow"><button data-t="${t}">${esc(TOPICS[t])}${(C.xTopics||[]).includes(t)?' <span class="chip extra">extra</span>':''}</button><div class="bar" aria-hidden="true"><i style="width:${pc}%"></i></div><span class="mono">${mastered}/${qs.length}</span></div>`;
  }).join('');
  const v = el(`<div class="stack">
    <section class="sheet stack">
      <div><h2>Práctica por tema</h2><p class="muted" style="margin-top:6px;max-width:66ch">Respondés y ves el feedback al instante. La barra muestra cuántas preguntas dominás (acertadas 2 veces seguidas). Elegí un tema o mezclá todo.</p></div>
      <div class="mastery">${rows}</div>
      <div class="row">
        <button class="btn primary" id="mix">Mezclar todo (20 preguntas)</button>
        <button class="btn" id="traps">Solo casi sinónimos y alias</button>
        <button class="btn" id="unseen">Solo las que nunca vi</button>
      </div>
    </section>
  </div>`);
  v.querySelectorAll('[data-t]').forEach(b => b.onclick = () => startPractice(BANK.filter(q=>q.t===b.dataset.t).map(q=>q.id), TOPICS[b.dataset.t]));
  v.querySelector('#mix').onclick = () => startPractice(shuffle(pool(prefs.extra)).slice(0,20).map(q=>q.id), 'Mezcla');
  v.querySelector('#traps').onclick = () => startPractice(pool(prefs.extra).filter(q=>q.s==='casi'||q.s==='alias').map(q=>q.id), 'Casi sinónimos y alias');
  v.querySelector('#unseen').onclick = () => { const ids = pool(prefs.extra).filter(q=>!stats[q.id]).map(q=>q.id); ids.length ? startPractice(ids, 'Nunca vistas') : flash(v, 'Ya viste todas las preguntas. Probá con "Mis errores".'); };
  app.appendChild(v);
}
function flash(container, msg){ const p = el(`<p class="advice">${esc(msg)}</p>`); container.querySelector('.sheet').appendChild(p); }
function startPractice(ids, label){
  prac = {label, items: shuffle(ids).map(id => inst(BANK[id])), i:0, ok:0, answered:false};
  viewPrac(); window.scrollTo({top:0});
}
function viewPrac(){
  const p = prac;
  app.innerHTML = '';
  if(p.i >= p.items.length){
    const v = el(`<section class="sheet stack"><h2>${esc(p.label)}: terminaste</h2>
      <p class="big">${p.ok}<small>/${p.items.length}</small></p>
      <p class="muted">Las que fallaste quedaron en <b>Mis errores</b> y vuelven a aparecer hasta que las aciertes dos veces seguidas.</p>
      <div class="row"><button class="btn primary" id="back">Elegir otro tema</button><button class="btn" id="errs">Ir a Mis errores</button></div></section>`);
    v.querySelector('#back').onclick = () => { prac = null; render(); };
    v.querySelector('#errs').onclick = () => setMode('err');
    app.appendChild(v); return;
  }
  const it = p.items[p.i];
  const state = p.answered ? 'review' : 'answer';
  const v = el(`<div class="stack">
    <div class="row" style="justify-content:space-between"><span class="eyebrow">${esc(p.label)} · ${p.i+1} de ${p.items.length}</span><span class="mono muted" style="font-size:.85rem">${p.ok} correctas</span></div>
    <div class="progress"><i style="width:${100*p.i/p.items.length}%"></i></div>
    <section class="sheet">
      <div class="q">
        <div class="q-stem"><span class="q-num">${p.i+1}.</span><span>${esc(it.q.q)}</span><div class="q-meta">${metaChips(it.q)}</div></div>
        <div class="opts">${it.order.map((o,k)=>optHTML(it,k,o,state)).join('')}</div>
        ${p.answered ? feedbackHTML(it, null) : ''}
      </div>
    </section>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" id="quit">Terminar</button>
      ${p.answered ? '<button class="btn primary" id="next">Siguiente</button>' : '<button class="btn ghost" id="skip">No sé · ver respuesta</button>'}
    </div>
  </div>`);
  if(!p.answered){
    v.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.orig));
    v.querySelector('#skip').onclick = () => answer(null);
  } else {
    const n = v.querySelector('#next'); n.onclick = () => { p.i++; p.answered = false; viewPrac(); }; setTimeout(()=>n.focus(), 0);
  }
  v.querySelector('#quit').onclick = () => { p.i = p.items.length; viewPrac(); };
  app.appendChild(v);
  function answer(choice){
    it.choice = choice; p.answered = true;
    const ok = choice === it.q.a; if(ok) p.ok++;
    record(it.q.id, ok);
    viewPrac();
  }
}

/* ---------- MODO ERRORES ---------- */
function viewErr(){
  app.innerHTML = '';
  const ids = Object.entries(stats).filter(([,s]) => s.w > 0 && s.b < 2)
    .sort((a,b) => a[1].b - b[1].b || b[1].w - a[1].w).map(([id]) => +id).filter(id => BANK[id]);
  if(!ids.length){
    const v = el(`<section class="sheet empty"><h2>No tenés errores pendientes</h2><p style="margin-top:8px">Cuando falles una pregunta en el simulacro o en la práctica aparece aquí. Sale de la lista al acertarla dos veces seguidas.</p><div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" id="go">Hacer un simulacro</button></div></section>`);
    v.querySelector('#go').onclick = () => setMode('sim');
    app.appendChild(v); return;
  }
  const byT = {}; ids.forEach(id => { const t = BANK[id].t; byT[t] = (byT[t]||0)+1; });
  const v = el(`<section class="sheet stack">
    <div><h2>Mis errores · ${ids.length} por repasar</h2><p class="muted" style="margin-top:6px;max-width:66ch">Repetir lo que fallaste, con las opciones en otro orden, es lo que más rinde por minuto. Cada pregunta sale de la lista al acertarla dos veces seguidas.</p></div>
    <div class="chips">${Object.entries(byT).map(([t,n])=>`<span class="chip">${esc(TOPICS[t])} · ${n}</span>`).join('')}</div>
    <div class="row"><button class="btn primary" id="go">Repasar mis errores</button><button class="btn ghost" id="reset">Borrar mi progreso</button></div>
    <div id="confirm"></div>
  </section>`);
  v.querySelector('#go').onclick = () => { setMode('prac', true); startPractice(ids, 'Mis errores'); };
  v.querySelector('#reset').onclick = () => {
    const c = v.querySelector('#confirm');
    c.innerHTML = `<div class="advice row" style="justify-content:space-between"><span>¿Borrar todas las estadísticas y mejores notas?</span><span class="row"><button class="btn" id="no">Cancelar</button><button class="btn primary" id="yes">Sí, borrar</button></span></div>`;
    c.querySelector('#no').onclick = () => c.innerHTML = '';
    c.querySelector('#yes').onclick = () => { stats = {}; store.set(K+'-stats', {}); try{ Object.keys(localStorage).filter(k=>k.startsWith(K+'-best-')).forEach(k=>localStorage.removeItem(k)); }catch(e){} renderLegend(); viewErr(); };
  };
  app.appendChild(v);
}

/* ---------- MODO CONTRASTES ---------- */
function viewCmp(){
  app.innerHTML = '';
  const v = el(`<div class="stack">
    <section class="sheet stack">
      <div><h2>Tablas de contraste</h2><p class="muted" style="margin-top:6px;max-width:66ch">En selección simple los distractores suelen ser términos vecinos. Estas tablas ponen lado a lado lo que se confunde. Leé una tabla, cerrala y ponete a prueba con sus preguntas.</p></div>
      <div class="toc">${CONTRASTS.map(c=>`<a href="#c-${c.g}">${esc(c.title)}</a>`).join('')}</div>
    </section>
    ${CONTRASTS.map(c => {
      const n = BANK.filter(q => q.g === c.g).length;
      return `<section class="sheet cgroup" id="c-${c.g}">
        <h3>${esc(c.title)}</h3><p class="lead">${esc(c.lead)}</p>
        <div class="tbl"><table><thead><tr>${c.cols.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${c.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
        ${n ? `<div class="row"><button class="btn" data-g="${c.g}" data-title="${esc(c.title)}">Ponerme a prueba · ${n} preguntas</button></div>` : ''}
      </section>`; }).join('')}
  </div>`);
  v.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { setMode('prac', true); startPractice(BANK.filter(q=>q.g===b.dataset.g).map(q=>q.id), b.dataset.title); });
  v.querySelectorAll('.toc a').forEach(a => a.onclick = e => { e.preventDefault(); const t = document.getElementById(a.getAttribute('href').slice(1)); if(t) t.scrollIntoView({behavior:'smooth'}); });
  app.appendChild(v);
}

/* ---------- MODO CÓMO ESTUDIAR ---------- */
function viewHow(){
  app.innerHTML = '';
  const ev = (k, pen) => { const p = 1/k; return 2*p - pen*(1-p); };
  const fmt = x => { const r = Math.round(x*100)/100; const c = Math.abs(r) < 0.01 ? 'zero' : r > 0 ? 'pos' : 'neg'; return `<span class="${c}">${r > 0 ? '+' : ''}${r.toFixed(2)}</span>`; };
  const v = el(`<div class="stack">
    <section class="sheet stack">
      <h2>El método</h2>
      <p class="muted" style="max-width:68ch">${esc(C.methodLead)}</p>
      <ol class="steps">
        <li><div><b>Diagnóstico.</b> Hacé un simulacro en frío antes de repasar. Marcá Seguro o Dudo con honestidad. La nota importa menos que saber dónde estás.</div></li>
        <li><div><b>Contraste.</b> Por cada tema que falló, abrí su tabla en <i>Contrastes</i>. La pregunta que tenés que poder responder es "¿qué palabra del enunciado delata a esta opción y no a su vecina?".</div></li>
        <li><div><b>Práctica con feedback.</b> Hacé la práctica de ese tema. Cuando falles, leé por qué tu opción no era antes de mirar la correcta.</div></li>
        <li><div><b>Repaso espaciado.</b> Volvé a <i>Mis errores</i> horas después, y otra vez al día siguiente. Las opciones cambian de orden en cada intento, así que no podés memorizar posiciones.</div></li>
        <li><div><b>Simulacro final.</b> Hacé un modelo fijo que no hayas visto, con el factor de corrección real, y decidí qué dejar en blanco según tu acierto en las dudosas.</div></li>
      </ol>
    </section>
    <section class="sheet stack">
      <h2>¿Arriesgar o dejar en blanco?</h2>
      <p class="muted" style="max-width:68ch">Puntos esperados por pregunta según cuántas opciones te quedan después de descartar. Una respuesta correcta vale +2.</p>
      <div class="tbl"><table class="ev mono"><thead><tr><th>Opciones que quedan</th>${[2,1,0].map(p=>`<th>${p?'Factor −'+p:'Sin resta'}</th>`).join('')}</tr></thead><tbody>
        ${[4,3,2].map(k=>`<tr><td>${k} (${k===4?'no descarto ninguna':'descarto '+(4-k)})</td>${[2,1,0].map(p=>`<td>${fmt(ev(k,p))}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>
      <p style="max-width:68ch">Con <b>−2</b>, adivinar entre 4 te quita 1 punto en promedio, y con 2 opciones quedás en cero. Solo conviene responder si tu acierto supera el 50%. Con <b>−1</b> conviene arriesgar si lograste descartar al menos una opción. <b>Sin resta</b>, nunca dejes nada en blanco.</p>
    </section>
    <section class="sheet stack">
      <h2>${esc(C.howTitle)}</h2>
      <ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:68ch">
        ${C.howAsk.map(([b,t])=>`<li><b>${esc(b)}</b> ${esc(t)}</li>`).join('')}
      </ul>
    </section>
  </div>`);
  app.appendChild(v);
}

/* ---------- navegación ---------- */
let mode = 'sim';
function setMode(m, keep){
  mode = m;
  document.querySelectorAll('nav.modes button').forEach(b => b.setAttribute('aria-selected', b.dataset.mode === m));
  store.set(K+'-mode', m);
  if(!keep) render();
}
function render(){
  if(mode === 'sim') sim ? viewSim() : viewSimSetup();
  else if(mode === 'prac') prac ? viewPrac() : viewPracSetup();
  else if(mode === 'err') viewErr();
  else if(mode === 'cmp') viewCmp();
  else viewHow();
}
document.querySelectorAll('nav.modes button').forEach(b => b.onclick = () => {
  if(b.dataset.mode === 'prac' && mode === 'prac') prac = null;
  if(b.dataset.mode === 'sim' && mode === 'sim' && sim && sim.done) sim = null;
  setMode(b.dataset.mode);
});
const hash = (location.hash || '').slice(1);
mode = ['sim','prac','err','cmp','how'].includes(hash) ? hash : store.get(K+'-mode', 'sim');
setMode(mode);
renderLegend();
})();
</script>
